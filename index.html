<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>中3英単語クイズ</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="quiz-panel" aria-labelledby="app-title">
        <div class="top-bar">
          <div>
            <p class="eyebrow">Junior High English</p>
            <h1 id="app-title">中3英単語クイズ</h1>
          </div>
          <div class="score-card" aria-live="polite">
            <span class="score-label">Score</span>
            <strong id="scoreText">0 / 0</strong>
          </div>
        </div>

        <div class="progress-wrap" aria-label="進み具合">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <article class="question-card">
          <p id="questionNumber" class="question-number">Question 1</p>
          <h2 id="questionText">読み込み中...</h2>
          <div id="choices" class="choices" role="group" aria-label="選択肢"></div>
          <p id="feedback" class="feedback" aria-live="polite"></p>
        </article>

        <div class="actions">
          <button id="nextButton" class="primary-button" type="button">次の問題</button>
          <button id="restartButton" class="ghost-button" type="button">最初から</button>
        </div>
      </section>

      <aside class="review-panel" aria-labelledby="review-title">
        <h2 id="review-title">復習リスト</h2>
        <p id="reviewHint">間違えた単語がここに表示されます。</p>
        <ul id="reviewList"></ul>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
